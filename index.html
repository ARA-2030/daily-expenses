:18px}</style><main><div class="row"><h1>Daily Expenses <small style="font-size:12px">v1.6.7 preview</small></h1><button class="small" id="theme">☾ / ☀</button></div><div id="app"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), yen=n=>'¥'+Number(n).toLocaleString('ja-JP'), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);const defaults=['Cash / 現金','OKB / 大垣共立銀行','Tokai Rokin / 東海ろうきん','MUFG / 三菱UFJ銀行','Japan Post / ゆうちょ','Mizuho / みずほ銀行','PayPay','Points / ポイント','Credit Card / カード'].map((name,i)=>({id:'w'+i,name,type:i===7?'points':i===8?'card':'asset',initial:0}));let s={wallets:defaults,tx:[],dark:false,categories:['Food / 食費','Shopping / 買い物','Fuel / 燃料','Utilities / 光熱費','Education / 教育','Other / その他']};try{let raw=localStorage.getItem('daily-expenses-v1');if(raw)s=JSON.parse(raw)}catch(e){alert('保存データを読み込めませんでした')};let page='Home',kind='expense',editing=null,filter='',month=today().slice(0,7);function catList(k){if(k==='income')return s.incomeCategories??=( ['Salary / 給料','Bonus / 賞与','Other / その他',...new Set(s.tx.filter(t=>t.kind==='income').map(t=>t.category).filter(Boolean))].filter((v,i,a)=>a.indexOf(v)===i));return s.categories}function save(){try{localStorage.setItem('daily-expenses-v1',JSON.stringify(s))}catch(e){alert('保存できません。バックアップしてください。')}}function bal(w){return s.tx.reduce((n,t)=>n+(t.wallet===w.id?(t.kind==='income'?t.amount:-t.amount):0)+(t.kind==='transfer'&&t.dest===w.id?t.amount:0),w.initial)}function name(id){return s.wallets.find(w=>w.id===id)?.name||'Unknown'}function total(k,m){return s.tx.filter(t=>t.kind===k&&t.date.startsWith(m)&&s.wallets.find(w=>w.id===t.wallet)?.type!=='points').reduce((a,t)=>a+t.amount,0)}function go(p){page=p;editing=null;filter='';render()}function add(k){kind=k;go('Add')}function opts(list,sel){return list.map(w=>`<option value="${esc(w.id)}" ${w.id===sel?'selected':''}>${esc(w.name)}</option>`).join('')}function history(list){return list.length?list.map(t=>`<div class="item"><div class="row"><b class="wrap">${esc(t.desc||t.category||t.kind)}</b><b class="${t.kind==='expense'?'negative':''}">${t.kind==='expense'?'−':t.kind==='income'?'+':''}${s.wallets.find(w=>w.id===t.wallet)?.type==='points'?t.amount+' pt':yen(t.amount)}</b></div><div class="muted">${esc(t.date)} · ${esc(name(t.wallet))}${t.kind==='transfer'?' → '+esc(name(t.dest)):''}</div><div class="row"><span></span><div><button class="small" onclick="editTx('${t.id}')">Edit / 編集</button> <button class="small" onclick="delTx('${t.id}')">削除</button></div></div></div>`).join(''):'<p class="muted">No records / 記録なし</p>'}function sorted(){return [...s.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}function render(){document.body.classList.toggle('dark',s.dark);$('nav').innerHTML=['Home','History','Add','Report','Cards','Settings'].map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${['⌂','☷','＋','▥','▣','⚙'][i]}<br>${p}<br>${['残高','履歴','入力','集計','カード','設定'][i]}</button>`).join('');let a=$('app');if(page==='Home'){let assets=s.wallets.filter(w=>w.type==='asset').reduce((n,w)=>n+bal(w),0), cards=s.wallets.filter(w=>w.type==='card').reduce((n,w)=>n+bal(w),0);a.innerHTML=`<article class="hero">Total Assets / 資産合計<div class="big">${yen(assets)}</div><p>Card Balance / カード残高 ${yen(cards)}</p>Net Balance / 差引残高<div class="big">${yen(assets+cards)}</div></article><div class="actions"><button onclick="add('expense')">− Expense / 支出</button><button onclick="add('income')">＋ Income / 収入</button><button onclick="add('transfer')">⇄ Transfer / 移動</button></div><h2>Wallet Balance / 残高一覧</h2>${s.wallets.some(w=>w.hidden)?'<p class="muted">非表示口座の残高も資産・カード合計に含まれます。</p>':''}${s.wallets.filter(w=>!w.hidden).map(w=>`<div class="item row wallet-row"><button class="wallet-name" style="background:none;color:inherit;text-align:left;padding:0" onclick="${w.type==='card'?`openCard('${w.id}')`:`showWallet('${w.id}')`}">${esc(w.name)}</button><b class="wallet-amount ${bal(w)<0?'negative':''}">${w.type==='points'?bal(w).toLocaleString()+' pt':yen(bal(w))}</b><button type="button" style="background:transparent;color:inherit;padding:8px;min-width:36px" aria-label="Edit name / 名前編集" title="Edit name / 名前編集" onclick="renameWallet('${w.id}')">✎</button></div>`).join('')}<button onclick="go('Settings')">＋ Add Wallet / 口座追加</button><article>今月 / This month<p>Income / 収入 ${yen(total('income',today().slice(0,7)))}</p>Expense / 支出 ${yen(total('expense',today().slice(0,7)))}</article><h2>Recent / 最近の履歴</h2>${history(sorted().slice(0,5))}`}
if(page==='Add'){let t=s.tx.find(t=>t.id===editing)||{}, w=s.wallets.find(w=>w.id===t.wallet)||s.wallets[0];a.innerHTML=`<form id="txform"><h2>${editing?'Edit / 編集':'New Transaction / 新規入力'}</h2><label>Type / 種類</label><select id="kind"><option value="expense">Expense / 支出</option><option value="income">Income / 収入</option><option value="transfer">Transfer / 資金移動・カード返済・キャッシング</option></select><label>Date / 日付</label><input id="date" type="date" required value="${esc(t.date||today())}"><label>Wallet / 口座・支払い方法</label><select id="wallet">${opts(s.wallets.filter(w=>!w.hidden||w.id===t.wallet),t.wallet)}</select><div id="destbox"><label>To / 移動先</label><select id="dest"></select></div><div id="catbox"><div class="row"><label>Category / 分類</label><button type="button" class="small" onclick="toggleCats()">✎ Edit / 編集</button></div><select id="cat"></select><div id="catEditor" hidden></div></div><div id="cardplan" hidden><label>Payment method / 支払方法</label><select id="pm"><option value="single">一括払い</option><option value="two">2回払い</option><option value="install">分割払い</option><option value="revo">リボ払い（元金定額・概算）</option><option value="cashSingle">キャッシング（一括払い）</option><option value="cash">キャッシング（リボ払い・元金定額・概算）</option></select><label>初回支払日（任意・カード明細優先）</label><input type="date" id="firstpay" value="${esc(t.plan?.firstpay)}"><div id="planextra"><label>分割回数</label><input id="pn" type="number" min="2" max="120" value="${esc(t.plan?.n??3)}"><label>分割手数料総額（円・契約表から入力）</label><input id="pf" type="number" min="0" step="1" value="${esc(t.plan?.fee)}"><label>毎月元金返済額（円）</label><input id="pp" type="number" min="1" step="1" value="${esc(t.plan?.principal??10000)}"><label>実質年率（%・契約条件）</label><input id="pr" type="number" min="0" max="100" step="0.01" value="${esc(t.plan?.rate)}"></div><p class="muted">分割は総手数料を均等配分。リボは月割り、キャッシングは日割り365日（閏年366日）概算。実際の明細を優先。</p></div><label>Description / 内容</label><input id="desc" value="${esc(t.desc)}"><label>Amount / 金額・ポイント</label><input id="amount" type="number" min="1" step="1" required value="${esc(t.amount)}"><button class="full">Save / 保存</button></form>`;$('kind').value=kind;$('pm').value=t.plan?.method||'single';function update(){let w=s.wallets.find(w=>w.id===$('wallet').value);$('destbox').hidden=$('kind').value!=='transfer';$('dest').innerHTML=opts(s.wallets.filter(x=>x.id!==w?.id&&(!x.hidden||x.id===t.dest)&&((w?.type==='asset'&&['asset','card'].includes(x.type))||(w?.type==='card'&&x.type==='asset'))),t.dest);updatePlan()}$('kind').onchange=()=>{update();refreshCats();};$('wallet').onchange=update;$('pm').onchange=()=>updatePlan(true);update();refreshCats(t.category);$('txform').onsubmit=e=>{e.preventDefault();let k=$('kind').value,w=$('wallet').value,d=$('dest').value,n=Number($('amount').value);if(!w||!Number.isSafeInteger(n)||n<=0||(k==='transfer'&&!d)){alert('入力を確認してください');return}let record={...t,id:editing||uid(),kind:k,wallet:w,dest:k==='transfer'?d:'',date:$('date').value,category:k==='transfer'?'':$('cat').value,desc:$('desc').value,amount:n};delete record.plan;if(!$('cardplan').hidden){try{let c=cfg(s.wallets.find(x=>x.id===w)),method=$('pm').value;let plan={method,firstpay:$('firstpay').value,n:Number($('pn').value),fee:$('pf').value===''?null:Number($('pf').value),principal:Number($('pp').value),rate:$('pr').value===''?null:Number($('pr').value),cycle:{close:c.close,offset:c.offset,due:c.due}};record.plan=plan;paymentRows(record)}catch(e){alert(e.message);return}}s.tx=s.tx.filter(t=>t.id!==editing);s.tx.push(record);save();go('Home')}}
if(page==='Cards')cardPage(a);if(page==='History'){a.innerHTML=`<h2>History / 履歴</h2><label>Wallet / 口座</label><select id="filter"><option value="">All / 全て</option>${opts(s.wallets,filter)}</select><label>Search / 検索</label><input id="search" placeholder="日付・内容・分類"><div id="results"></div>`;$('filter').value=filter;function update(){filter=$('filter').value;let q=$('search').value.toLowerCase();$('results').innerHTML=history(sorted().filter(t=>(!filter||t.wallet===filter||t.dest===filter)&&[t.date,t.desc,t.category,name(t.wallet)].join(' ').toLowerCase().includes(q)))}$('filter').onchange=update;$('search').oninput=update;update()}
if(page==='Report'){a.innerHTML=`<h2>Report / 集計</h2><input id="month" type="month" value="${month}"><article>Income / 収入 <b>${yen(total('income',month))}</b><p>Expense / 支出 <b>${yen(total('expense',month))}</b></p>Net / 収支 ${yen(total('income',month)-total('expense',month))}</article>${s.categories.map(c=>{let n=s.tx.filter(t=>t.kind==='expense'&&t.category===c&&t.date.startsWith(month)&&s.wallets.find(w=>w.id===t.wallet)?.type!=='points').reduce((a,t)=>a+t.amount,0);return `<article><div class="row">${esc(c)} <b>${yen(n)}</b></div><div class="bar" style="width:${total('expense',month)?100*n/total('expense',month):0}%"></div></article>`}).join('')}`;$('month').onchange=e=>{month=e.target.value;render()}}
if(page==='Settings'){a.innerHTML=`<h2>Wallet Settings / 口座設定</h2>${s.wallets.map((w,i)=>`<article><b>${esc(w.name)}</b><p class="muted">初期残高 ${w.initial} · ${w.type} · ${w.hidden?'Hidden / 非表示':'Active / 表示中'}</p><div class="actions"><button onclick="editWallet('${w.id}')">編集</button><button onclick="move(${i},-1)">↑</button><button onclick="move(${i},1)">↓</button></div><div class="actions" style="margin-top:8px"><button onclick="toggleWallet('${w.id}')">${w.hidden?'Show / 再表示':'Hide / 非表示'}</button><button style="background:#a63d40" onclick="deleteWallet('${w.id}')">Delete / 削除</button></div></article>`).join('')}<button onclick="editWallet('')">＋ Add Wallet / 口座追加</button><h2>Categories / 分類</h2><div id="settingsCats"></div><h2>Backup / バックアップ</h2><div class="actions"><button onclick="backup()">JSON 保存</button><button onclick="csv()">CSV 出力</button></div><label>Restore / 復元（現在のデータを置換）</label><input id="restore" type="file" accept=".json,application/json"><p class="muted">データはこのブラウザ内に保存されます。定期的にバックアップしてください。</p>`;drawCats('settingsCats','expense');drawCats('settingsCats','income',true);$('restore').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.wallets)||!Array.isArray(v.tx)||!Array.isArray(v.categories)||!v.wallets.every(w=>/^[a-z0-9]+$/.test(w.id)&&typeof w.name==='string'&&['asset','card','points'].includes(w.type)&&Number.isSafeInteger(w.initial))||!v.tx.every(t=>/^[a-z0-9]+$/.test(t.id)&&Number.isSafeInteger(t.amount)&&t.amount>0&&typeof t.date==='string'&&['expense','income','transfer'].includes(t.kind)&&v.wallets.some(w=>w.id===t.wallet)&&(t.kind!=='transfer'||v.wallets.some(w=>w.id===t.dest))))throw Error();if(confirm('現在のデータを置き換えますか？')){s=v;save();render()}}catch(e){alert('復元できません')}}}}
function toggleWallet(id){let w=s.wallets.find(w=>w.id===id);if(!w)return;if(!w.hidden&&s.wallets.filter(x=>!x.hidden).length<=1){alert('表示する口座を1つ以上残してください');return}if(!w.hidden&&!confirm('非表示にしますか？ 残高は資産合計に含まれ、履歴も残ります。'))return;w.hidden=!w.hidden;save();render()}function deleteWallet(id){let w=s.wallets.find(w=>w.id===id);if(!w)return;if((w.bills||[]).length||s.tx.some(t=>t.wallet===id||t.dest===id)||bal(w)!==0){alert('履歴または残高がある口座は削除できません。非表示をご利用ください。');return}if(s.wallets.length<=1||(!w.hidden&&s.wallets.filter(x=>!x.hidden).length<=1)){alert('表示する口座を1つ以上残してください');return}if(!confirm(w.name+' を削除しますか？ / Delete wallet?'))return;s.wallets=s.wallets.filter(x=>x.id!==id);save();render()}function renameWallet(id){let w=s.wallets.find(w=>w.id===id);if(!w)return;let n=prompt('Name / 口座名を編集',w.name);if(n===null)return;if(!n.trim()){alert('名前を入力してください');return}w.name=n.trim();save();render()}function showWallet(id){page='History';filter=id;render()}function editTx(id){let rt=s.tx.find(t=>t.id===id);if(rt?.repayment){openCard(rt.dest);alert('返済登録欄から修正してください');return}if(rt?.repayFee){openCard(s.tx.find(t=>t.id===rt.repayFee)?.dest);return}editing=id;kind=s.tx.find(t=>t.id===id).kind;page='Add';render()}function delTx(id){let rt=s.tx.find(t=>t.id===id);if(rt?.repayment||rt?.repayFee){alert('カード詳細の返済履歴から削除してください');return}if(confirm('削除しますか？')){s.tx=s.tx.filter(t=>t.id!==id);save();render()}}function move(i,d){let j=i+d;if(j<0||j>=s.wallets.length)return;[s.wallets[i],s.wallets[j]]=[s.wallets[j],s.wallets[i]];save();render()}function editWallet(id){let w=s.wallets.find(w=>w.id===id)||{name:'',type:'asset',initial:0};$('app').innerHTML=`<form id="wf"><h2>Wallet / 口座設定</h2><label>Name / 名前</label><input id="wn" required value="${esc(w.name)}"><label>Type / 種類</label><select id="wt" ${id?'disabled':''}><option value="asset">Bank・Cash・電子マネー</option><option value="card">Credit Card / カード</option><option value="points">Points / ポイント</option></select><label>Opening Balance / 初期残高（カード未 function actualForecast(w,strict=false){let states=[],legacy=0,errors=0;for(let t of s.tx.filter(t=>t.wallet===w.id&&['expense','transfer'].includes(t.kind))){if(!t.plan){legacy++;continue}try{let orig=paymentRows(t);states.push({t,orig,left:t.amount,prev:t.date})}catch(e){errors++}}states.sort((a,b)=>a.t.date.localeCompare(b.t.date)||a.t.id.localeCompare(b.t.id));let payments=s.tx.filter(t=>t.dest===w.id&&t.repayment).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));let groups={},unallocated=0;for(let p of payments){for(let m of repayMethods){let n=p.repayment.parts[m]||0;for(let z of states.filter(z=>z.t.plan.method===m&&z.t.date<=p.date)){let take=Math.min(n,z.left);z.left-=take;n-=take;if(take)z.prev=p.date;if(!n)break}unallocated+=n}}if(strict&&unallocated)throw Error('返済元金が登録済みの対象利用残高を超えています');let now=today(),months=states.filter(z=>z.left).map(z=>z.orig[0].nominal.slice(0,7));let start=months.length?months.sort()[0]:now.slice(0,7);let [y,mo]=start.split('-').map(Number);for(let i=0;i<1200&&states.some(z=>z.left);i++){let base=new Date(Date.UTC(y,mo-1+i,1)),month=dateISO(base).slice(0,7),budgets={};for(let m of ['revo','cash'])budgets[m]=(w.revoChanges||[]).filter(x=>x.method===m&&x.month<=month).sort((a,b)=>a.month.localeCompare(b.month)).at(-1)?.amount;for(let z of states){if(!z.left||z.orig[0].nominal.slice(0,7)>month)continue;let p=z.t.plan,m=p.method,rev=['revo','cash'].includes(m),r=z.orig.find(r=>r.nominal.slice(0,7)===month);if(!rev&&!r)continue;let nom=r?.nominal||dateISO(cutoff(base.getUTCFullYear(),base.getUTCMonth(),p.cycle?.due||Number(z.orig[0].nominal.slice(-2)))),pay=r?.pay||nom;if(!r){let d=new Date(pay+'T00:00:00Z');while(bankHoliday(d))d=plusDay(d,1);pay=dateISO(d)}let principal=Math.min(z.left,rev?(budgets[m]??p.principal):r.principal),fee=0;if(rev){if(m==='revo')fee=Math.floor(z.left*p.rate/1200);else{let f=0;for(let d=plusDay(new Date(z.prev+'T00:00:00Z'),1);dateISO(d)<=pay;d=plusDay(d,1)){let yy=d.getUTCFullYear();f+=z.left*p.rate/100/((Date.UTC(yy+1,0,1)-Date.UTC(yy,0,1))/86400000)}fee=Math.floor(f+1e-8)}if(budgets[m]!=null)budgets[m]-=principal}else fee=r.fee;let g=groups[month]??={principal:0,fee:0,methods:{},dates:new Set()};g.principal+=principal;g.fee+=fee;g.methods[m]=(g.methods[m]||0)+principal;g.dates.add(pay);z.left-=principal;if(pay>z.prev)z.prev=pay}}return {groups,legacy,errors,unallocated,remaining:states.reduce((a,z)=>a+z.left,0)}}
function forecast(w){if(!s.tx.some(t=>t.dest===w.id&&t.repayment))return oldForecast(w);let {groups,legacy,errors,unallocated,remaining}=actualForecast(w),labels=Object.fromEntries(repayMethods.map((m,i)=>[m,repayLabels[i]]));let unpaid=Object.values(groups).reduce((a,g)=>a+g.principal,0),unknown=s.tx.filter(t=>t.dest===w.id&&t.kind==='transfer'&&!t.repayment).reduce((a,t)=>a+t.amount,0);return `<article><h2>Auto forecast / 月別自動請求予定</h2><p class="muted">返済内訳を反映した残元金の概算。過去の確定明細・返済履歴は別管理。返済前の予定表は保存されません。分割手数料の繰上精算はカード会社の明細を優先。</p><p>予定元金合計 ${yen(unpaid)}</p>${unknown?`<p class="negative">未配分返済 ${yen(unknown)}：内訳登録が必要</p>`:''}${legacy||errors||unallocated||remaining?`<p class="negative">未設定・計算不能 ${legacy+errors}件 / 未配分 ${yen(unallocated)} / 期間外 ${yen(remaining)}</p>`:''}${Object.entries(groups).sort().map(([m,g])=>`<div class="item"><div class="row"><b>${m}</b><b>${yen(g.principal+g.fee)}</b></div><p class="muted">支払予定日：${[...g.dates].sort().join(' / ')}</p><p class="muted">${Object.entries(g.methods).map(([k,v])=>labels[k]+' '+yen(v)).join(' / ')}</p>元金 ${yen(g.principal)} · 手数料 ${yen(g.fee)}</div>`).join('')||'対象取引なし'}</article>`}

$('theme').onclick=()=>{s.dark=!s.dark;save();render()};render();

function dateISO(d){return d.toISOString().slice(0,10)}
function cutoff(y,m,n){return new Date(Date.UTC(y,m,Math.min(n,new Date(Date.UTC(y,m+1,0)).getUTCDate())))}
function plusDay(d,n){return new Date(d.getTime()+n*86400000)}
function bankHoliday(d){let y=d.getUTCFullYear(),m=d.getUTCMonth()+1,n=d.getUTCDate();let fixed={2025:['01-01','01-13','02-11','02-23','02-24','03-20','04-29','05-03','05-04','05-05','05-06','07-21','08-11','09-15','09-23','10-13','11-03','11-23','11-24'],2026:['01-01','01-12','02-11','02-23','03-20','04-29','05-03','05-04','05-05','05-06','07-20','08-11','09-21','09-22','09-23','10-12','11-03','11-23'],2027:['01-01','01-11','02-11','02-23','03-21','03-22','04-29','05-03','05-04','05-05','07-19','08-11','09-20','09-23','10-11','11-03','11-23']};return d.getUTCDay()===0||d.getUTCDay()===6||(m===1&&n<=3)||(m===12&&n===31)||(fixed[y]||[]).includes(dateISO(d).slice(5))}
function cycle(ref,c){if(!ref||![c.close,c.offset,c.due].every(Number.isInteger)||c.close<1||c.close>31||c.due<1||c.due>31||c.offset<0||c.offset>2)throw Error('締め日・支払月・支払日を設定してください');let d=new Date(ref+'T00:00:00Z'),y=d.getUTCFullYear(),m=d.getUTCMonth();if(d>cutoff(y,m,c.close))m++;let end=cutoff(y,m,c.close),start=plusDay(cutoff(y,m-1,c.close),1),pay=cutoff(y,m+c.offset,c.due);if(pay<end)throw Error('支払日は締め日以降に設定してください');while(bankHoliday(pay))pay=plusDay(pay,1);return {start:dateISO(start),end:dateISO(end),pay:dateISO(pay),nominal:dateISO(cutoff(y,m+c.offset,c.due))}}
function setupCycle(w){let choose=$('cyclechoice'),info=$('presetinfo');function show(apply){let p=presets.find(p=>p.name===$('issuer').value);choose.hidden=!p?.alternatives?.length;choose.innerHTML='<option value="0">標準サイクル</option>'+ (p?.alternatives||[]).map((a,i)=>`<option value="${i+1}">${esc(a.label)}</option>`).join('');info.textContent=p?.verified?'公式確認済み（通常ショッピング）。契約条件を確認。 '+p.source:'未検証：契約明細から手動入力してください。';if(apply)fill()}
function fill(){let p=presets.find(p=>p.name===$('issuer').value);if(!p?.verified){alert('このカードは手動設定してください');return}let a=Number(choose.value)?p.alternatives[Number(choose.value)-1]:p;for(let k of ['close','offset','due'])$(k).value=a[k];if(!$('product').value)$('product').value=p.name}
$('issuer').onchange=()=>{for(let k of ['product','revo','cash','close','offset','due'])$(k).value='';show(true)};choose.onchange=fill;$('applypreset').onclick=fill;show(false);$('autodates').onclick=()=>{try{let c={};for(let k of ['close','offset','due'])c[k]=$(k).value===''?null:Number($(k).value);let v=cycle($('refdate').value,c);for(let k of ['start','end','pay'])$(k).value=v[k];if(!['2025','2026','2027'].includes(v.pay.slice(0,4)))alert('祝日データ対象外の年です。支払日を確認してください。')}catch(e){alert(e.message)}}}

function updatePlan(reset=false){let w=s.wallets.find(x=>x.id===$('wallet').value),k=$('kind').value,active=w?.type==='card'&&['expense','transfer'].includes(k);$('cardplan').hidden=!active;if(!active)return;let cash=k==='transfer';for(let o of $('pm').options){o.hidden=o.disabled=cash!==['cash','cashSingle'].includes(o.value)}if(cash&&!['cash','cashSingle'].includes($('pm').value))$('pm').value='cashSingle';else if(!cash&&['cash','cashSingle'].includes($('pm').value))$('pm').value='single';$('pm').disabled=false;let m=$('pm').value;for(let [id,on] of [['pn',m==='install'],['pf',m==='install'],['pp',['revo','cash'].includes(m)],['pr',['revo','cash','cashSingle'].includes(m)]]){$(id).hidden=!on;$(id).previousElementSibling.hidden=!on}if(reset||(!$('pr').value&&!editing)){let r=cfg(w)[['cash','cashSingle'].includes(m)?'cash':'revo'];$('pr').value=r??''}}
function paymentRows(t){let p=t.plan;if(!p)return [];let m=p.method,n=t.amount;if(!Number.isSafeInteger(n)||n<=0)throw Error('金額を確認');let auto=p.firstpay?null:cycle(t.date,p.cycle);let first=p.firstpay||auto.pay;if(first<t.date)throw Error('初回支払日は利用日以降');let d=new Date(first+'T00:00:00Z');if(!Number.isFinite(+d))throw Error('支払日を確認');let rows=[],left=n,prev=new Date(t.date+'T00:00:00Z');let count=['single','cashSingle'].includes(m)?1:m==='two'?2:m==='install'?p.n:Math.ceil(n/p.principal);if(!Number.isInteger(count)||count<1||count>120)throw Error('返済回数は120回以内に設定');if(m==='install'&&(!Number.isSafeInteger(p.fee)||p.fee<0||count<2))throw Error('分割回数・総手数料を入力');if(['cash','revo'].includes(m)&&(!Number.isSafeInteger(p.principal)||p.principal<1||p.rate==null||!Number.isFinite(p.rate)||p.rate<0||p.rate>100))throw Error('毎月元金と契約年率を入力');let due=p.cycle?.due||d.getUTCDate(),anchor=d.getUTCMonth(),year=d.getUTCFullYear();if(auto){let nominal=new Date(auto.nominal+'T00:00:00Z');anchor=nominal.getUTCMonth();year=nominal.getUTCFullYear()}else{let prior=cutoff(year,anchor-1,due);while(bankHoliday(prior))prior=plusDay(prior,1);if(+prior===+d)anchor--;}for(let i=0;i<count;i++){let pay=i===0?new Date(d):cutoff(year,anchor+i,due);while(bankHoliday(pay))pay=plusDay(pay,1);let principal=['cash','revo'].includes(m)?Math.min(left,p.principal):i===count-1?left:Math.floor(n/count);let fee=0;if(m==='install')fee=Math.floor(p.fee/count)+(i===count-1?p.fee%count:0);if(m==='revo')fee=Math.floor(left*p.rate/1200);if(m==='cashSingle'&&(p.rate==null||!Number.isFinite(p.rate)||p.rate<0||p.rate>100))throw Error('契約年率を入力');if(['cash','cashSingle'].includes(m)){let f=0;for(let x=plusDay(prev,1);x<=pay;x=plusDay(x,1)){let y=x.getUTCFullYear(),days=(Date.UTC(y+1,0,1)-Date.UTC(y,0,1))/86400000;f+=left*p.rate/100/days}fee=Math.floor(f+1e-8)}rows.push({pay:dateISO(pay),principal,fee,method:m,nominal:dateISO(cutoff(year,anchor+i,due))});left-=principal;prev=pay}return rows}
function oldForecast(w){let groups={},errors=0,legacy=0;for(let t of s.tx.filter(t=>t.wallet===w.id&&['expense','transfer'].includes(t.kind))){if(!t.plan){legacy++;continue}try{for(let r of forecastRows(w,t)){let g=groups[r.nominal.slice(0,7)]??={principal:0,fee:0,methods:{},dates:new Set()};g.dates.add(r.pay);g.principal+=r.principal;g.fee+=r.fee;g.methods[r.method]=(g.methods[r.method]||0)+r.principal}}catch(e){errors++}}let labels={single:'一括',two:'2回',install:'分割',revo:'リボ',cash:'キャッシングリボ',cashSingle:'キャッシング一括'};return `<article><h2>Auto forecast / 月別自動請求予定</h2><p class="muted">請求月別の概算（過去分含む）。休日による翌月引落日は別記。手動明細とは合算しません。返済・繰上返済は未反映。リボは設定適用月以降、カード単位・区分別の元金定額（古い利用から充当）。過去の予定は維持。実績は別管理。祝日データは2025～2027年。</p>${legacy?`<p>支払方法未登録の旧取引：${legacy}件（履歴から編集可能）</p>`:''}${errors?`<p>計算不能：${errors}件</p>`:''}${Object.entries(groups).sort().map(([m,g])=>`<div class="item"><div class="row"><b>${m}</b><b>${yen(g.principal+g.fee)}</b></div><p class="muted">実際の支払予定日：${[...g.dates].sort().join(' / ')}</p><p class="muted">${Object.entries(g.methods).map(([k,v])=>labels[k]+' '+yen(v)).join(' / ')}</p>元金 ${yen(g.principal)} · 手数料 ${yen(g.fee)}</div>`).join('')||'<p>対象取引なし</p>'}</article>`}

function revoSettings(w){let h=w.revoChanges||[];return `<article><h2>リボ返済額変更 / Revolving payment</h2><p class="muted">適用開始月以降のカード全体の毎月元金。ショッピング・キャッシング別。過去の予定は変更しません。</p><label>返済区分</label><select id="rcKind"><option value="revo">ショッピングリボ</option><option value="cash">キャッシングリボ</option></select><label>変更日</label><input id="rcDate" type="date" value="${today()}"><label>適用開始月（請求月）</label><input id="rcMonth" type="month" min="${today().slice(0,7)}"><label>毎月元金（円）</label><input id="rcAmount" type="number" min="1" step="1"><button class="full" onclick="addRevoChange('${w.id}')">変更登録</button><h2>変更履歴</h2>${h.map(x=>`<p>${x.method==='cash'?'キャッシング':'ショッピング'} · ${esc(x.date)} 登録 · ${esc(x.month)} 適用 · ${yen(x.amount)}</p>`).join('')||'<p>変更なし</p>'}</article>`}
function addRevoChange(id){let w=s.wallets.find(x=>x.id===id),method=$('rcKind').value,date=$('rcDate').value,month=$('rcMonth').value,amount=Number($('rcAmount').value);if(!date||!month||month<date.slice(0,7)||month<today().slice(0,7)||!Number.isSafeInteger(amount)||amount<1){alert('変更日・適用月・元金を確認してください');return}let h=w.revoChanges??=[];if(h.some(x=>x.method===method&&x.month>=month)){alert('既存の変更履歴より後の適用月を指定してください');return}if(!confirm('適用月以降の返済予定を変更しますか？ 確定明細は変更しません。'))return;h.push({method,date,month,amount});save();render()}
function forecastRows(w,t){let m=t.plan?.method,h=(w.revoChanges||[]).filter(x=>x.method===m).sort((a,b)=>a.month.localeCompare(b.month));if(!['cash','revo'].includes(m)||!h.length)return paymentRows(t);let all=s.tx.filter(x=>x.wallet===w.id&&x.plan?.method===m).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));let start=h[0].month,states=all.map(x=>{let orig=paymentRows(x),old=orig.filter(r=>r.nominal.slice(0,7)<start);return {x,orig,rows:old,left:x.amount-old.reduce((n,r)=>n+r.principal,0),prev:old.at(-1)?.pay||x.date}});let [y,mo]=start.split('-').map(Number);for(let i=0;i<1200&&states.some(z=>z.left>0);i++){let base=new Date(Date.UTC(y,mo-1+i,1)),month=dateISO(base).slice(0,7),budget=h.filter(x=>x.month<=month).at(-1).amount;for(let z of states){if(!z.left||z.orig[0].nominal.slice(0,7)>month)continue;let p=z.x.plan,nom=cutoff(base.getUTCFullYear(),base.getUTCMonth(),p.cycle.due),pay=new Date(nom);while(bankHoliday(pay))pay=plusDay(pay,1);let first=z.orig[0];if(first.nominal.slice(0,7)===month)pay=new Date(first.pay+'T00:00:00Z');let principal=Math.min(z.left,budget),fee=0;if(m==='revo')fee=Math.floor(z.left*p.rate/1200);else{let f=0;for(let d=plusDay(new Date(z.prev+'T00:00:00Z'),1);d<=pay;d=plusDay(d,1)){let yy=d.getUTCFullYear();f+=z.left*p.rate/100/((Date.UTC(yy+1,0,1)-Date.UTC(yy,0,1))/86400000)}fee=Math.floor(f+1e-8)}z.rows.push({method:m,nominal:dateISO(nom),pay:dateISO(pay),principal,fee});z.left-=principal;budget-=principal;z.prev=dateISO(pay)}}if(states.some(z=>z.left>0))throw Error('返済期間が長すぎます');return states.find(z=>z.x.id===t.id).rows}
