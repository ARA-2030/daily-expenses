<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Daily Expenses v1.5</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#183344;font:16px system-ui}body.dark{background:#131c26;color:#eef4fa}main{max-width:650px;margin:auto;padding:18px 16px 100px}h1{font-size:25px}h2{font-size:18px}article,form,.item{background:white;border-radius:13px;padding:15px;margin:8px 0}.dark article,.dark form,.dark .item,.dark nav{background:#253442} .hero{background:#19465b!important;color:white}.big{font-size:32px;font-weight:bold}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{font-size:13px;opacity:.75}.negative{color:#d45c5c}button,input,select{font:inherit;border:1px solid #aab9c5;border-radius:8px;padding:11px;max-width:100%}button{cursor:pointer;background:#19465b;color:white;border:0}button.small{padding:7px;font-size:13px}input,select{width:100%;background:white;color:#183344}label{display:block;margin:12px 0 5px}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px #0002}nav button{background:transparent;color:inherit;flex:1;max-width:130px;font-size:12px;padding:8px 2px}nav button.active{color:#238b80;font-weight:bold}.actions{display:flex;gap:6px}.actions button{flex:1;font-size:13px} .bar{height:10px;background:#398a91;border-radius:5px} .dark input,.dark select{background:#17232e;color:white} .wrap{overflow-wrap:anywhere} .full{width:100%;margin-top:15px} .wallet-row{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:8px;align-items:center}.wallet-name{min-width:0;overflow-wrap:anywhere}.wallet-amount{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.wallet-row>button:last-child{width:36px;box-sizing:border-box}[hidden]{display:none!important}</style><main><div class="row"><h1>Daily Expenses <small style="font-size:12px">v1.5</small></h1><button class="small" id="theme">☾ / ☀</button></div><div id="app"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), yen=n=>'¥'+Number(n).toLocaleString('ja-JP'), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);const defaults=['Cash / 現金','OKB / 大垣共立銀行','Tokai Rokin / 東海ろうきん','MUFG / 三菱UFJ銀行','Japan Post / ゆうちょ','Mizuho / みずほ銀行','PayPay','Points / ポイント','Credit Card / カード'].map((name,i)=>({id:'w'+i,name,type:i===7?'points':i===8?'card':'asset',initial:0}));let s={wallets:defaults,tx:[],dark:false,categories:['Food / 食費','Shopping / 買い物','Fuel / 燃料','Utilities / 光熱費','Education / 教育','Other / その他']};try{let raw=localStorage.getItem('daily-expenses-v1');if(raw)s=JSON.parse(raw)}catch(e){alert('保存データを読み込めませんでした')};let page='Home',kind='expense',editing=null,filter='',month=today().slice(0,7);function catList(k){if(k==='income')return s.incomeCategories??=( ['Salary / 給料','Bonus / 賞与','Other / その他',...new Set(s.tx.filter(t=>t.kind==='income').map(t=>t.category).filter(Boolean))].filter((v,i,a)=>a.indexOf(v)===i));return s.categories}function save(){try{localStorage.setItem('daily-expenses-v1',JSON.stringify(s))}catch(e){alert('保存できません。バックアップしてください。')}}function bal(w){return s.tx.reduce((n,t)=>n+(t.wallet===w.id?(t.kind==='income'?t.amount:-t.amount):0)+(t.kind==='transfer'&&t.dest===w.id?t.amount:0),w.initial)}function name(id){return s.wallets.find(w=>w.id===id)?.name||'Unknown'}function total(k,m){return s.tx.filter(t=>t.kind===k&&t.date.startsWith(m)&&s.wallets.find(w=>w.id===t.wallet)?.type!=='points').reduce((a,t)=>a+t.amount,0)}function go(p){page=p;editing=null;filter='';render()}function add(k){kind=k;go('Add')}function opts(list,sel){return list.map(w=>`<option value="${esc(w.id)}" ${w.id===sel?'selected':''}>${esc(w.name)}</option>`).join('')}function history(list){return list.length?list.map(t=>`<div class="item"><div class="row"><b class="wrap">${esc(t.desc||t.category||t.kind)}</b><b class="${t.kind==='expense'?'negative':''}">${t.kind==='expense'?'−':t.kind==='income'?'+':''}${s.wallets.find(w=>w.id===t.wallet)?.type==='points'?t.amount+' pt':yen(t.amount)}</b></div><div class="muted">${esc(t.date)} · ${esc(name(t.wallet))}${t.kind==='transfer'?' → '+esc(name(t.dest)):''}</div><div class="row"><span></span><div><button class="small" onclick="editTx('${t.id}')">Edit / 編集</button> <button class="small" onclick="delTx('${t.id}')">削除</button></div></div></div>`).join(''):'<p class="muted">No records / 記録なし</p>'}function sorted(){return [...s.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}function render(){document.body.classList.toggle('dark',s.dark);$('nav').innerHTML=['Home','History','Add','Report','Settings'].map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${['⌂','☷','＋','▥','⚙'][i]}<br>${p}<br>${['残高','履歴','入力','集計','設定'][i]}</button>`).join('');let a=$('app');if(page==='Home'){let assets=s.wallets.filter(w=>w.type==='asset').reduce((n,w)=>n+bal(w),0), cards=s.wallets.filter(w=>w.type==='card').reduce((n,w)=>n+bal(w),0);a.innerHTML=`<article class="hero">Total Assets / 資産合計<div class="big">${yen(assets)}</div><p>Card Balance / カード残高 ${yen(cards)}</p>Net Balance / 差引残高<div class="big">${yen(assets+cards)}</div></article><div class="actions"><button onclick="add('expense')">− Expense / 支出</button><button onclick="add('income')">＋ Income / 収入</button><button onclick="add('transfer')">⇄ Transfer / 移動</button></div><h2>Wallet Balance / 残高一覧</h2>${s.wallets.some(w=>w.hidden)?'<p class="muted">非表示口座の残高も資産・カード合計に含まれます。</p>':''}${s.wallets.filter(w=>!w.hidden).map(w=>`<div class="item row wallet-row"><button class="wallet-name" style="background:none;color:inherit;text-align:left;padding:0" onclick="showWallet('${w.id}')">${esc(w.name)}</button><b class="wallet-amount ${bal(w)<0?'negative':''}">${w.type==='points'?bal(w).toLocaleString()+' pt':yen(bal(w))}</b><button type="button" style="background:transparent;color:inherit;padding:8px;min-width:36px" aria-label="Edit name / 名前編集" title="Edit name / 名前編集" onclick="renameWallet('${w.id}')">✎</button></div>`).join('')}<button onclick="go('Settings')">＋ Add Wallet / 口座追加</button><article>今月 / This month<p>Income / 収入 ${yen(total('income',today().slice(0,7)))}</p>Expense / 支出 ${yen(total('expense',today().slice(0,7)))}</article><h2>Recent / 最近の履歴</h2>${history(sorted().slice(0,5))}`}
if(page==='Add'){let t=s.tx.find(t=>t.id===editing)||{}, w=s.wallets.find(w=>w.id===t.wallet)||s.wallets[0];a.innerHTML=`<form id="txform"><h2>${editing?'Edit / 編集':'New Transaction / 新規入力'}</h2><label>Type / 種類</label><select id="kind"><option value="expense">Expense / 支出</option><option value="income">Income / 収入</option><option value="transfer">Transfer / 資金移動・カード返済・キャッシング</option></select><label>Date / 日付</label><input id="date" type="date" required value="${esc(t.date||today())}"><label>Wallet / 口座・支払い方法</label><select id="wallet">${opts(s.wallets.filter(w=>!w.hidden||w.id===t.wallet),t.wallet)}</select><div id="destbox"><label>To / 移動先</label><select id="dest"></select></div><div id="catbox"><div class="row"><label>Category / 分類</label><button type="button" class="small" onclick="toggleCats()">✎ Edit / 編集</button></div><select id="cat"></select><div id="catEditor" hidden></div></div><label>Description / 内容</label><input id="desc" value="${esc(t.desc)}"><label>Amount / 金額・ポイント</label><input id="amount" type="number" min="1" step="1" required value="${esc(t.amount)}"><button class="full">Save / 保存</button></form>`;$('kind').value=kind;function update(){let w=s.wallets.find(w=>w.id===$('wallet').value);$('destbox').hidden=$('kind').value!=='transfer';$('dest').innerHTML=opts(s.wallets.filter(x=>x.id!==w?.id&&(!x.hidden||x.id===t.dest)&&((w?.type==='asset'&&['asset','card'].includes(x.type))||(w?.type==='card'&&x.type==='asset'))),t.dest)}$('kind').onchange=()=>{update();refreshCats();};$('wallet').onchange=update;update();refreshCats(t.category);$('txform').onsubmit=e=>{e.preventDefault();let k=$('kind').value,w=$('wallet').value,d=$('dest').value,n=Number($('amount').value);if(!w||!Number.isSafeInteger(n)||n<=0||(k==='transfer'&&!d)){alert('入力を確認してください');return}let record={id:editing||uid(),kind:k,wallet:w,dest:k==='transfer'?d:'',date:$('date').value,category:k==='transfer'?'':$('cat').value,desc:$('desc').value,amount:n};s.tx=s.tx.filter(t=>t.id!==editing);s.tx.push(record);save();go('Home')}}
if(page==='History'){a.innerHTML=`<h2>History / 履歴</h2><label>Wallet / 口座</label><select id="filter"><option value="">All / 全て</option>${opts(s.wallets,filter)}</select><label>Search / 検索</label><input id="search" placeholder="日付・内容・分類"><div id="results"></div>`;$('filter').value=filter;function update(){filter=$('filter').value;let q=$('search').value.toLowerCase();$('results').innerHTML=history(sorted().filter(t=>(!filter||t.wallet===filter||t.dest===filter)&&[t.date,t.desc,t.category,name(t.wallet)].join(' ').toLowerCase().includes(q)))}$('filter').onchange=update;$('search').oninput=update;update()}
if(page==='Report'){a.innerHTML=`<h2>Report / 集計</h2><input id="month" type="month" value="${month}"><article>Income / 収入 <b>${yen(total('income',month))}</b><p>Expense / 支出 <b>${yen(total('expense',month))}</b></p>Net / 収支 ${yen(total('income',month)-total('expense',month))}</article>${s.categories.map(c=>{let n=s.tx.filter(t=>t.kind==='expense'&&t.category===c&&t.date.startsWith(month)&&s.wallets.find(w=>w.id===t.wallet)?.type!=='points').reduce((a,t)=>a+t.amount,0);return `<article><div class="row">${esc(c)} <b>${yen(n)}</b></div><div class="bar" style="width:${total('expense',month)?100*n/total('expense',month):0}%"></div></article>`}).join('')}`;$('month').onchange=e=>{month=e.target.value;render()}}
if(page==='Settings'){a.innerHTML=`<h2>Wallet Settings / 口座設定</h2>${s.wallets.map((w,i)=>`<article><b>${esc(w.name)}</b><p class="muted">初期残高 ${w.initial} · ${w.type} · ${w.hidden?'Hidden / 非表示':'Active / 表示中'}</p><div class="actions"><button onclick="editWallet('${w.id}')">編集</button><button onclick="move(${i},-1)">↑</button><button onclick="move(${i},1)">↓</button></div><div class="actions" style="margin-top:8px"><button onclick="toggleWallet('${w.id}')">${w.hidden?'Show / 再表示':'Hide / 非表示'}</button><button style="background:#a63d40" onclick="deleteWallet('${w.id}')">Delete / 削除</button></div></article>`).join('')}<button onclick="editWallet('')">＋ Add Wallet / 口座追加</button><h2>Categories / 分類</h2><div id="settingsCats"></div><h2>Backup / バックアップ</h2><div class="actions"><button onclick="backup()">JSON 保存</button><button onclick="csv()">CSV 出力</button></div><label>Restore / 復元（現在のデータを置換）</label><input id="restore" type="file" accept=".json,application/json"><p class="muted">データはこのブラウザ内に保存されます。定期的にバックアップしてください。</p>`;drawCats('settingsCats','expense');drawCats('settingsCats','income',true);$('restore').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.wallets)||!Array.isArray(v.tx)||!Array.isArray(v.categories)||!v.wallets.every(w=>/^[a-z0-9]+$/.test(w.id)&&typeof w.name==='string'&&['asset','card','points'].includes(w.type)&&Number.isSafeInteger(w.initial))||!v.tx.every(t=>/^[a-z0-9]+$/.test(t.id)&&Number.isSafeInteger(t.amount)&&t.amount>0&&typeof t.date==='string'&&['expense','income','transfer'].includes(t.kind)&&v.wallets.some(w=>w.id===t.wallet)&&(t.kind!=='transfer'||v.wallets.some(w=>w.id===t.dest))))throw Error();if(confirm('現在のデータを置き換えますか？')){s=v;save();render()}}catch(e){alert('復元できません')}}}}
function toggleWallet(id){let w=s.wallets.find(w=>w.id===id);if(!w)return;if(!w.hidden&&s.wallets.filter(x=>!x.hidden).length<=1){alert('表示する口座を1つ以上残してください');return}if(!w.hidden&&!confirm('非表示にしますか？ 残高は資産合計に含まれ、履歴も残ります。'))return;w.hidden=!w.hidden;save();render()}function deleteWallet(id){let w=s.wallets.find(w=>w.id===id);if(!w)return;if(s.tx.some(t=>t.wallet===id||t.dest===id)||bal(w)!==0){alert('履歴または残高がある口座は削除できません。非表示をご利用ください。');return}if(s.wallets.length<=1||(!w.hidden&&s.wallets.filter(x=>!x.hidden).length<=1)){alert('表示する口座を1つ以上残してください');return}if(!confirm(w.name+' を削除しますか？ / Delete wallet?'))return;s.wallets=s.wallets.filter(x=>x.id!==id);save();render()}function renameWallet(id){let w=s.wallets.find(w=>w.id===id);if(!w)return;let n=prompt('Name / 口座名を編集',w.name);if(n===null)return;if(!n.trim()){alert('名前を入力してください');return}w.name=n.trim();save();render()}function showWallet(id){page='History';filter=id;render()}function editTx(id){editing=id;kind=s.tx.find(t=>t.id===id).kind;page='Add';render()}function delTx(id){if(confirm('削除しますか？')){s.tx=s.tx.filter(t=>t.id!==id);save();render()}}function move(i,d){let j=i+d;if(j<0||j>=s.wallets.length)return;[s.wallets[i],s.wallets[j]]=[s.wallets[j],s.wallets[i]];save();render()}function editWallet(id){let w=s.wallets.find(w=>w.id===id)||{name:'',type:'asset',initial:0};$('app').innerHTML=`<form id="wf"><h2>Wallet / 口座設定</h2><label>Name / 名前</label><input id="wn" required value="${esc(w.name)}"><label>Type / 種類</label><select id="wt" ${id?'disabled':''}><option value="asset">Bank・Cash・電子マネー</option><option value="card">Credit Card / カード</option><option value="points">Points / ポイント</option></select><label>Opening Balance / 初期残高（カード未払いはマイナス）</label><input id="wi" type="number" step="1" required value="${w.initial}"><button class="full">Save / 保存</button></form><button onclick="go('Settings')">Cancel / 戻る</button>`;$('wt').value=w.type;$('wf').onsubmit=e=>{e.preventDefault();let n=Number($('wi').value);if(!Number.isSafeInteger(n)||!$('wn').value.trim())return;let v={id:id||uid(),name:$('wn').value.trim(),type:$('wt').value,initial:n,hidden:!!w.hidden};if(id)s.wallets=s.wallets.map(x=>x.id===id?v:x);else s.wallets.push(v);save();go('Settings')}}function refreshCats(selected){let k=$('kind').value;let old=selected??$('cat').value;let list=catList(k);$('catbox').hidden=k==='transfer';$('cat').innerHTML=[...new Set([...list,...(old&&s.tx.some(t=>t.id===editing&&t.category===old)?[old]:[])])].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(list.includes(old)||Array.from($('cat').options).some(o=>o.value===old))$('cat').value=old;if(!$('catEditor').hidden)drawCats('catEditor',k)}function toggleCats(){let e=$('catEditor');e.hidden=!e.hidden;if(!e.hidden)drawCats('catEditor',$('kind').value)}function drawCats(id,k,append=false){let h=`<article><b>${k==='income'?'Income / 収入':'Expense / 支出'}</b>${catList(k).map((c,i)=>`<div class="row"><span class="wrap">${esc(c)}</span><div><button type="button" class="small" onclick="changeCat('${k}',${i},'edit')">✎</button> <button type="button" class="small" onclick="changeCat('${k}',${i},'delete')">削除</button></div></div>`).join('')}<button type="button" onclick="changeCat('${k}',-1,'add')">＋ Add Category / 分類追加</button></article>`;if(append)$(id).insertAdjacentHTML('beforeend',h);else $(id).innerHTML=h}function changeCat(k,i,action){let list=catList(k),old=list[i],selected=$('cat')?.value;if(action==='delete'){if(list.length<=1){alert('分類を1つ以上残してください');return}if(s.tx.some(t=>t.kind===k&&t.category===old)){alert('履歴で使用中の分類は削除できません。名前変更は可能です。');return}if(!confirm('削除しますか？'))return;list.splice(i,1)}else{let n=prompt('Category / 分類名',old||'');if(n===null)return;n=n.trim();if(!n||list.includes(n))return;if(action==='add'){list.push(n);selected=n}else{list[i]=n;s.tx.forEach(t=>{if(t.kind===k&&t.category===old)t.category=n});if(selected===old)selected=n}}save();if(page==='Add')refreshCats(selected);else render()}function newCat(){let c=prompt('分類名 / Category');if(c?.trim()&&!s.categories.includes(c.trim())){s.categories.push(c.trim());save();render()}}function download(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download(JSON.stringify(s,null,2),'daily-expenses-backup.json','application/json')}function csv(){let quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('\ufeff'+[['Date','Type','Wallet','To','Category','Description','Amount'],...sorted().map(t=>[t.date,t.kind,name(t.wallet),t.dest?name(t.dest):'',t.category,t.desc,t.amount])].map(r=>r.map(quote).join(',')).join('\r\n'),'daily-expenses.csv','text/csv;charset=utf-8')}$('theme').onclick=()=>{s.dark=!s.dark;save();render()};render();
</script></html>
